<!-- BUDDHIST SERENITY SUITE: Audio Player Controller Widget                   -->

<div id="buddhist-audio-controller" class="buddhist-audio-pill" role="button" aria-label="Toggle Buddhist Temple Music">
    <div id="audio-icon-wrap" class="audio-pill-icon">🪷</div>
    <div id="audio-text-wrap" class="audio-pill-text">
        <div class="audio-pill-label">Temple Flute</div>
        <div id="audio-eq-bars" class="audio-pill-bars">
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
        </div>
    </div>
</div>

<audio id="buddhist-audio-element" loop preload="auto">
    <source src="./audio/buddhist_flute_blessing.mp3" type="audio/mpeg">
</audio>

<!-- ========================================================================== -->
<!-- SECTION 02: LIVE WEDDING COUNTDOWN                                         -->
<!-- Matches: css/sections/02-countdown.css | Data: content.json -> countdown   -->
<!-- ========================================================================== -->
<section id="countdown-section" class="template-section section-countdown" data-section="02-countdown">
    <div class="countdown-container">
        <!-- Countdown Heading -->
        <div class="countdown-heading-wrap" data-framer-name="Countdown Heading">
            <h2 class="countdown-heading-title">The countdown begins</h2>
        </div>

        <!-- Master Modular Countdown Timer -->
        <div class="countdown-timer-wrap" data-framer-name="Countdown Timer">
            <div class="countdown-units-grid" id="live-wedding-timer">
                <!-- Unit 1: DAYS -->
                <div class="countdown-unit" data-unit="days">
                    <div class="countdown-digits-box">
                        <span class="countdown-digit" id="timer-days-tens">0</span>
                        <span class="countdown-digit" id="timer-days-ones">0</span>
                    </div>
                    <span class="countdown-unit-label">DAYS</span>
                </div>

                <!-- Unit 2: HOURS -->
                <div class="countdown-unit" data-unit="hours">
                    <div class="countdown-digits-box">
                        <span class="countdown-digit" id="timer-hours-tens">0</span>
                        <span class="countdown-digit" id="timer-hours-ones">0</span>
                    </div>
                    <span class="countdown-unit-label">HOURS</span>
                </div>

                <!-- Unit 3: MINUTES -->
                <div class="countdown-unit" data-unit="minutes">
                    <div class="countdown-digits-box">
                        <span class="countdown-digit" id="timer-minutes-tens">0</span>
                        <span class="countdown-digit" id="timer-minutes-ones">0</span>
                    </div>
                    <span class="countdown-unit-label">MINUTES</span>
                </div>

                <!-- Unit 4: SECONDS -->
                <div class="countdown-unit" data-unit="seconds">
                    <div class="countdown-digits-box">
                        <span class="countdown-digit" id="timer-seconds-tens">0</span>
                        <span class="countdown-digit" id="timer-seconds-ones">0</span>
                    </div>
                    <span class="countdown-unit-label">SECONDS</span>
                </div>
            </div>
        </div>

        <!-- Countdown Intro Text -->
        <div class="countdown-intro-wrap" data-framer-name="Countdown Intro Text">
            <p class="countdown-intro-line">Our families are excited that you are able to join</p>
            <p class="countdown-intro-line">us in celebrating what we hope will be one</p>
            <p class="countdown-intro-line">of the happiest days of our lives</p>
        </div>

        <!-- Star / Flourish Divider -->
        <div class="countdown-divider-wrap" data-framer-name="Countdown Divider">
            <img loading="lazy" decoding="async" src="./images/Countdown_Divider_Mobile.webp" alt="Countdown Divider Flourish" class="countdown-divider-img">
        </div>

        <!-- Portrait Backdrop (Gautam Buddha Enlightenment Sanctuary) -->
        <div class="countdown-backdrop-wrap" data-framer-name="Countdown Backdrop">
            <img loading="lazy" decoding="async" src="./images/Countdown_Frame_Mobile.webp" alt="Sacred Buddha Backdrop" class="countdown-backdrop-img">
        </div>
    </div>
</section>
